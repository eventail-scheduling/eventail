name: Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # test-api and test-web gate on this job's outputs, and a skipped job reports
  # success to a required check, so every path that cannot determine the answer
  # has to answer "both" rather than fail.
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail

          run_both() {
            printf 'api=true\nweb=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          }

          # A push to main has no base to diff against.
          [ -n "$BASE" ] || run_both

          # --no-renames so a file moved across the package boundary is listed
          # under both paths rather than only its destination.
          changed=$(git diff --no-renames --name-only "$BASE" HEAD) || run_both

          shared='^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|biome\.json|compose\.yml|\.github/)'

          for package in api web; do
            if printf '%s\n' "$changed" | grep -qE "^$package/|$shared"; then
              echo "$package=true" >> "$GITHUB_OUTPUT"
            else
              echo "$package=false" >> "$GITHUB_OUTPUT"
            fi
          done

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - run: pnpm exec biome ci .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  test-api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - run: docker compose up -d --wait postgres-test oidc s3
      - run: docker compose run --rm s3-init
      - run: pnpm --filter api --fail-if-no-match test

  test-web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - run: pnpm --filter web --fail-if-no-match test

  build-images:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [api, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.package }}/Dockerfile
          push: false
          cache-from: type=gha
