server {
  listen 80;
  server_name frontend;
  root /usr/share/nginx/html;

  absolute_redirect off;

  gzip on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_buffers 16 8k;
  gzip_http_version 1.1;
  gzip_types text/css application/javascript application/json application/font-woff application/font-tff image/gif image/png image/svg+xml application/octet-stream;

  # Repeated in each location rather than set once on the server: nginx drops
  # every inherited add_header from a level that declares one of its own, and
  # both of these declare Cache-Control.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
    add_header X-Frame-Options "DENY";
    add_header Content-Security-Policy "frame-ancestors 'none'";
    add_header X-Content-Type-Options "nosniff";
  }

  location /assets {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Frame-Options "DENY";
    add_header Content-Security-Policy "frame-ancestors 'none'";
    add_header X-Content-Type-Options "nosniff";
  }
}
