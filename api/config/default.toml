[log]
level = "info"

[email]
confirmReminderCooldown = "P3D"

[jwt]
algorithms = ["RS256"]
debug = false

[userInfo]
cacheTtl = "PT5M"

[worker.leader]
electionInterval = "PT1M"
pollInterval = "PT1M"

[postgres]
poolSize = 10

[worker.runtime]
fallbackInterval = "PT30S"
reconnectDelay = "PT5S"
concurrency = 1
drainTimeout = "PT15S"
maxAttempts = 25

[worker.scheduler]
interval = "PT5S"
limit = 1_000

[worker.cleaner]
interval = "PT30S"
canceledJobRetentionPeriod = "PT24H"
completedJobRetentionPeriod = "PT24H"
discardedJobRetentionPeriod = "P7D"

[worker.inviteSweeper]
interval = "PT1H"

[worker.filePruner]
interval = "PT24H"
minimumAge = "PT24H"

[worker.userSweeper]
interval = "PT6H"
retentionPeriod = "P180D"

[worker.rescuer]
interval = "PT30S"
limit = 1_000
rescueAfter = "PT1H"
