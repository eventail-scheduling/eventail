services:
  postgres:
    image: postgres:17
    ports:
      - '12002:5432'
    volumes:
      - 'postgres-data:/var/lib/postgresql/data'
    environment:
      - POSTGRES_PASSWORD=dev
      - POSTGRES_USER=dev
      - POSTGRES_DB=dev
    healthcheck:
      # -h forces TCP; during initdb the temporary server only listens on the
      # unix socket and would pass a socket-based check too early.
      test: [ "CMD-SHELL", "pg_isready -U dev -h 127.0.0.1" ]
      interval: 1s
      retries: 20
      start_period: 5s

  postgres-test:
    image: postgres:17
    ports:
      - '12008:5432'
    tmpfs:
      - /var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=dev
      - POSTGRES_USER=dev
    healthcheck:
      # -h forces TCP; during initdb the temporary server only listens on the
      # unix socket and would pass a socket-based check too early.
      test: [ "CMD-SHELL", "pg_isready -U dev -h 127.0.0.1" ]
      interval: 1s
      retries: 20
      start_period: 5s

  oidc:
    image: ghcr.io/navikt/mock-oauth2-server:6.0.1
    ports:
      - '12003:12003'
    environment:
      - SERVER_PORT=12003
      - JSON_CONFIG_PATH=/tmp/config/config.json
    volumes:
      - ./dev/oidc:/tmp/config:ro
    healthcheck:
      # The mock server rejects HEAD, so no wget --spider here.
      test:
        - CMD
        - wget
        - '-q'
        - '-O'
        - /dev/null
        - http://localhost:12003/default/.well-known/openid-configuration
      interval: 2s
      retries: 30
      start_period: 2s

  mail:
    image: axllent/mailpit:v1.30.7
    ports:
      - '12004:8025'
      - '12005:1025'

  s3:
    image: rustfs/rustfs:1.0.0-rc.2
    ports:
      - '12006:12006'
      - '12007:12007'
    volumes:
      - 's3-data:/data'
    environment:
      - RUSTFS_VOLUMES=/data
      - RUSTFS_ADDRESS=:12006
      - RUSTFS_CONSOLE_ADDRESS=:12007
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_EXTERNAL_ADDRESS=:12006
      - RUSTFS_CORS_ALLOWED_ORIGINS=*
      - RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS=*
      - RUSTFS_ACCESS_KEY=rustfsadmin
      - RUSTFS_SECRET_KEY=rustfsadmin
      - RUSTFS_LOG_LEVEL=info
    healthcheck:
      # /health answers before the S3 API can serve requests; /health/ready
      # is the readiness probe rustfs's own helm chart uses.
      test: [ "CMD", "curl", "-f", "http://localhost:12006/health/ready" ]
      interval: 1s
      retries: 20
      start_period: 5s

  s3-init:
    image: amazon/aws-cli:2.34.48
    depends_on:
      s3:
        condition: service_healthy
    # Mirrors what an operator applies to a production bucket, minus the
    # narrower CORS origin. POST is the only cross-origin request a browser
    # makes: an image tag rendering a public url is not subject to CORS.
    entrypoint: >
      sh -c "
        aws --endpoint-url http://s3:12006 s3 mb s3://uploads;
        aws --endpoint-url http://s3:12006 s3api put-bucket-cors --bucket uploads --cors-configuration '{
          \"CORSRules\": [{
            \"AllowedOrigins\": [\"*\"],
            \"AllowedMethods\": [\"POST\"],
            \"AllowedHeaders\": [\"*\"]
          }]
        }';
        aws --endpoint-url http://s3:12006 s3api put-bucket-policy --bucket uploads --policy '{
          \"Version\": \"2012-10-17\",
          \"Statement\": [{
            \"Sid\": \"PublicImages\",
            \"Effect\": \"Allow\",
            \"Principal\": \"*\",
            \"Action\": [\"s3:GetObject\"],
            \"Resource\": [
              \"arn:aws:s3:::uploads/*/sessions/*/teaser-image/*\",
              \"arn:aws:s3:::uploads/*/hosts/*/avatar/*\"
            ]
          }]
        }'
      "
    environment:
      - AWS_ACCESS_KEY_ID=rustfsadmin
      - AWS_SECRET_ACCESS_KEY=rustfsadmin
      - AWS_DEFAULT_REGION=us-east-1

volumes:
  postgres-data:
  s3-data:
